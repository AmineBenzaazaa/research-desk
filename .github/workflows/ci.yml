name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash          # bash -eo pipefail: a failing gate still fails through `| tee`
        working-directory: backend
    env:
      # No secrets: Gemini is never called by tests/evals, Langfuse tracing is a no-op without keys.
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache embedding + reranker models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: models-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'backend/desk/config.py') }}
          restore-keys: models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Retrieval quality gate (no LLM calls)
        run: python -m desk.evals --report eval-report.json | tee eval-output.txt

      - name: Gate summary
        if: always()
        run: |
          if [ ! -f eval-report.json ]; then
            echo "### Retrieval quality gate: did not run" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("eval-report.json"))
          s, g = r["summary"], r["gate"]
          print(f"### Retrieval quality gate: {'PASS' if r['passed'] else 'FAIL'}\n")
          print("| metric | value | gate (min) |\n|---|---|---|")
          for k in ["hit_rate", "mrr", "answerable_recall", "unanswerable_rejected", "vague_hit_rate", "ms_per_query"]:
              v = s[k]
              gate = (f"{g[k]['min']} {'ok' if g[k]['ok'] else 'FAIL'}") if k in g else ""
              print(f"| {k} | {v:.3f} | {gate} |" if isinstance(v, float) else f"| {k} | {v} | {gate} |")
          print(f"\nRerank threshold: {r['threshold']} · {len(r['rows'])} questions")
          EOF

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            backend/eval-report.json
            backend/eval-output.txt
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build   # tsc -b (typecheck) + vite build
